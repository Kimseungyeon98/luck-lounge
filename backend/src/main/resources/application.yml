spring:
  application:
    name: luck-lounge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lucklounge}
    username: ${DB_USER:lucklounge}
    password: ${DB_PASSWORD:lucklounge}
    hikari:
      # 아무도 없을 때는 DB 연결을 모두 닫는다. 연결이 남아 있으면 Railway 가 서버를 재우지 못한다(App Sleeping).
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      keepalive-time: 0
      # 잠들어 있던 DB 가 깨어나는 시간까지 기다린다
      connection-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  # Railway 는 PORT 환경 변수로 포트를 알려 준다. 없으면 8080
  port: ${PORT:8080}
  forward-headers-strategy: framework
  # 홈 화면에 추가용 앱 정보 파일
  mime-mappings:
    webmanifest: application/manifest+json
  shutdown: graceful

lucklounge:
  # 팀 링크를 로그에 찍을 때 쓰는 주소. 운영에서는 https://{도메인}
  base-url: ${BASE_URL:http://localhost:8080}
  # 서버 첫 실행 때 자동으로 만들 팀 이름
  default-team-name: ${DEFAULT_TEAM_NAME:우리 팀}
