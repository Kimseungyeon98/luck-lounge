<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F2EEE8" />
    <title>운빨 라운지</title>
    <meta name="description" content="오늘의 커피 내기 · 링크를 누르면 라운지로 들어가요" />
    <!-- 단톡방 링크 미리보기. 팀 링크(/t/…)로 열면 서버가 팀 이름과 전체 주소로 바꿔 준다 (SpaController) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="운빨 라운지" />
    <meta property="og:title" content="운빨 라운지" />
    <meta property="og:description" content="오늘의 커피 내기 · 링크를 누르면 라운지로 들어가요" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 홈 화면에 추가 -->
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="운빨 라운지" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 첫 화면이 뜨기 전 로딩 표시 (스크립트보다 먼저 보이게 여기에 둔다) -->
    <style>
      html, body { height: 100%; margin: 0; background: #F2EEE8; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #18202B; }
      .boot-brand { margin: 0; font-family: "Black Han Sans", -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 34px; color: #FF6A3D; }
      .boot-msg { margin: 0; font-size: 15px; color: #5A6472; }
      .boot-dots { display: flex; gap: 6px; }
      .boot-dots i { width: 9px; height: 9px; border-radius: 50%; background: #FF6A3D; animation: boot 1s infinite ease-in-out; }
      .boot-dots i:nth-child(2) { animation-delay: 0.15s; } .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot-dots i { animation: none; opacity: 0.7; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="app"><div class="boot" role="status"><p class="boot-brand">운빨 라운지</p><div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div><p class="boot-msg">라운지 준비 중…</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
